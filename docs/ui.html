<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opencode UI</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee;
         display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 8px 12px; background: #1b1b1b; border-bottom: 1px solid #333;
           display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
  header input { background: #222; color: #eee; border: 1px solid #444; border-radius: 6px;
                 padding: 5px 8px; font-size: 13px; }
  #server { width: 230px; } #model { width: 250px; } #sessionId { width: 200px; }
  button { background: #2d5a8f; color: #fff; border: 0; border-radius: 6px;
           padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button:disabled { opacity: .5; }
  #status { color: #9c9; margin-left: auto; }
  #status.err { color: #f88; }
  main { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap;
         word-break: break-word; line-height: 1.5; font-size: 14px; }
  .user { align-self: flex-end; background: #2d5a8f; }
  .assistant { align-self: flex-start; background: #242424; border: 1px solid #383838; }
  .sys { align-self: center; color: #999; font-size: 12px; }
  footer { padding: 10px 12px; background: #1b1b1b; border-top: 1px solid #333;
           display: flex; gap: 8px; }
  #input { flex: 1; background: #222; color: #eee; border: 1px solid #444; border-radius: 8px;
           padding: 9px; font-size: 14px; resize: none; }
</style>
</head>
<body>
<header>
  <label>サーバ <input id="server" value="http://100.102.129.64:4096"></label>
  <label>モデル <input id="model" value="opencode/deepseek-v4.1-flash-free"></label>
  <button id="newSession">新規セッション</button>
  <label>セッション <input id="sessionId" placeholder="(未作成)"></label>
  <button id="loadSession">履歴を読む</button>
  <span id="status">未接続</span>
</header>
<main id="chat"></main>
<footer>
  <textarea id="input" rows="2" placeholder="プロンプトを入力（Enter で送信、Shift+Enter で改行）"></textarea>
  <button id="send">送信</button>
</footer>
<script>
"use strict";
// This page depends only on the opencode server's public REST API:
//   POST /session                 -> create a session
//   POST /session/{id}/message    -> send a prompt, wait for the reply
//   GET  /session/{id}/message    -> read a session's history
// Nothing else about opencode (version, storage, internals) is assumed.
const $ = id => document.getElementById(id);
const chat = $("chat"), statusEl = $("status");
$("server").value = localStorage.getItem("oc-server") || $("server").value;
$("model").value = localStorage.getItem("oc-model") || $("model").value;

function base() { return $("server").value.replace(/\/+$/, ""); }
function setStatus(text, isErr) {
  statusEl.textContent = text;
  statusEl.className = isErr ? "err" : "";
}
function addMsg(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
async function api(path, options) {
  const res = await fetch(base() + path, options);
  if (!res.ok) throw new Error(path + " -> HTTP " + res.status);
  return res.status === 204 ? null : res.json();
}
function sessionId() { return $("sessionId").value.trim(); }

async function ensureSession() {
  if (sessionId()) return sessionId();
  setStatus("セッション作成中…");
  const s = await api("/session", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: "{}",
  });
  $("sessionId").value = s.id;
  setStatus("接続済み");
  return s.id;
}

async function send() {
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  $("send").disabled = true;
  addMsg("user", text);
  const wait = addMsg("sys", "応答待ち…");
  try {
    const id = await ensureSession();
    const [providerID, ...rest] = $("model").value.split("/");
    const reply = await api("/session/" + encodeURIComponent(id) + "/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: { providerID, modelID: rest.join("/") },
        parts: [{ type: "text", text }],
      }),
    });
    wait.remove();
    const out = (reply.parts || []).filter(p => p.type === "text").map(p => p.text).join("");
    addMsg("assistant", out || "(テキスト応答なし)");
    setStatus("接続済み");
  } catch (e) {
    wait.remove();
    addMsg("sys", "エラー: " + e.message);
    setStatus("エラー", true);
  } finally {
    $("send").disabled = false;
  }
}

$("send").onclick = send;
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("newSession").onclick = async () => {
  $("sessionId").value = "";
  chat.innerHTML = "";
  try { await ensureSession(); } catch (e) { setStatus("エラー: " + e.message, true); }
};
$("loadSession").onclick = async () => {
  const id = sessionId();
  if (!id) { setStatus("セッション ID がありません", true); return; }
  try {
    const messages = await api("/session/" + encodeURIComponent(id) + "/message");
    chat.innerHTML = "";
    for (const m of messages) {
      const text = (m.parts || []).filter(p => p.type === "text").map(p => p.text).join("");
      if (text) addMsg(m.info && m.info.role === "user" ? "user" : "assistant", text);
    }
    setStatus("接続済み");
  } catch (e) { setStatus("エラー: " + e.message, true); }
};
$("server").onchange = () => localStorage.setItem("oc-server", $("server").value);
$("model").onchange = () => localStorage.setItem("oc-model", $("model").value);
</script>
</body>
</html>
