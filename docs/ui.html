<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opencode UI</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee;
         display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 8px 12px; background: #1b1b1b; border-bottom: 1px solid #333;
           display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
  header input, header select { background: #222; color: #eee; border: 1px solid #444;
           border-radius: 6px; padding: 5px 8px; font-size: 13px; }
  #server { width: 230px; } #model { width: 250px; }
  #serverHistory { max-width: 210px; }
  #sessionSearch { width: 170px; }
  #sessionList { flex: 1; min-width: 220px; }
  button { background: #2d5a8f; color: #fff; border: 0; border-radius: 6px;
           padding: 6px 12px; font-size: 13px; cursor: pointer; }
  #abort, #deleteSession { background: #8f2d2d; }
  button:disabled { opacity: .5; }
  #status { color: #9c9; margin-left: auto; }
  #status.err { color: #f88; }
  #titleBar { padding: 6px 12px; background: #161616; border-bottom: 1px solid #2a2a2a;
              font-size: 13px; display: flex; gap: 10px; align-items: baseline; }
  #curTitle { font-weight: 600; }
  #curId { color: #888; font-size: 11px; word-break: break-all; }
  #curCount { color: #888; font-size: 11px; white-space: nowrap; }
  #titleBar input { background: #222; color: #eee; border: 1px solid #444;
           border-radius: 6px; padding: 4px 8px; font-size: 13px; margin-left: auto; width: 170px; }
  #chatSearchCount { color: #888; font-size: 12px; white-space: nowrap; }
  #titleBar .copybtn { margin-left: 0; }
  main { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap;
         word-break: break-word; line-height: 1.5; font-size: 14px; }
  /* Markdown 表示: アシスタントの応答は見出し・太字・コードなど
     を簡易表示する。装飾は表示だけで、コピーや検索は元の文面が対象。 */
  .msg pre { background: #1b1b1b; border: 1px solid #444; border-radius: 6px;
             padding: 8px; overflow-x: auto; margin: 6px 0; white-space: pre; }
  .msg code { background: rgba(255,255,255,.09); padding: 1px 4px;
              border-radius: 4px; font-size: 13px; }
  .msg pre code { background: none; padding: 0; }
  .msg a { color: #7fb3e8; }
  .md-h1 { font-size: 17px; font-weight: 700; margin: 6px 0 2px; }
  .md-h2 { font-size: 15px; font-weight: 700; margin: 6px 0 2px; }
  .md-h3 { font-size: 14px; font-weight: 700; margin: 6px 0 2px; }
  .user { align-self: flex-end; background: #2d5a8f; }
  .assistant { align-self: flex-start; background: #242424; border: 1px solid #383838; }
  .sys { align-self: center; color: #999; font-size: 12px; }
  .msgtime { font-size: 11px; color: #bbb; opacity: .75; margin-top: 4px; text-align: right; }
  .msgfoot { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .msgfoot .msgtime { margin-top: 0; }
  .copybtn { background: transparent; border: 1px solid #555; color: #ccc;
             border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer;
             margin-left: auto; flex-shrink: 0; }
  /* 折りたたんだメッセージ: 本文の表示だけを先頭までに絞る。
     下端をフェードさせ、続きがあることが分かるようにする。 */
  .msg.collapsed ._body { max-height: 11em; overflow: hidden;
    -webkit-mask-image: linear-gradient(#000 75%, transparent);
    mask-image: linear-gradient(#000 75%, transparent); }
  .usage { align-self: flex-start; color: #888; font-size: 12px; padding: 0 2px; }
  .tool { align-self: flex-start; color: #aaa; font-size: 12px; padding: 1px 6px;
          border-left: 2px solid #555; margin-left: 2px; }
  .tool.err { color: #f88; border-color: #8f2d2d; }
  .tool .tooldetail { display: none; white-space: pre-wrap; word-break: break-word;
    font-size: 11px; color: #bbb; background: #1b1b1b; border: 1px solid #444;
    border-radius: 6px; padding: 6px 8px; margin-top: 4px; max-height: 30dvh; overflow-y: auto; }
  .tool .tooldetail.open { display: block; }
  .tool .detailbtn { margin-left: 6px; }
  .msg.dimmed, .tool.dimmed { opacity: .35; }
  .msg.match, .tool.match { outline: 1px solid #2d5a8f; }
  .msg.current, .tool.current { outline: 2px solid #e8a33d; }
  footer { padding: 10px 12px; background: #1b1b1b; border-top: 1px solid #333;
           display: flex; gap: 8px; flex-wrap: wrap; }
  footer select { background: #222; color: #eee; border: 1px solid #444;
           border-radius: 6px; padding: 5px 8px; font-size: 13px; max-width: 170px; }
  #input { flex: 1; background: #222; color: #eee; border: 1px solid #444; border-radius: 8px;
           padding: 9px; font-size: 14px; resize: none; max-height: 40dvh; overflow-y: auto; }
  #charCount { color: #888; font-size: 12px; align-self: center; white-space: nowrap; }
  /* 会話をさかのぼって読んでいるときだけ出る「最新へ」ボタン。
     フッターの上に浮かせ、表示・非表示は JS が切り替える。 */
  #toLatest { position: fixed; right: 14px; bottom: 84px; display: none;
              box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  /* 明るい表示: 暗い配色のままでは日差しの強い場所で読みにくい
     ため、背景と文字色を入れ替えた配色を用意する。ヘッダーの
     ボタンで切り替え、選択は localStorage に保存する。 */
  body.light { color-scheme: light; background: #f4f4f4; color: #222; }
  body.light header { background: #fff; border-color: #ddd; }
  body.light header input, body.light header select { background: #fff; color: #222; border-color: #bbb; }
  body.light #status { color: #2a7a2a; }
  body.light #status.err { color: #c00; }
  body.light #titleBar { background: #ececec; border-color: #ddd; }
  body.light #curId, body.light #curCount, body.light #chatSearchCount { color: #666; }
  body.light #titleBar input { background: #fff; color: #222; border-color: #bbb; }
  body.light .msg a { color: #1a5fb4; }
  body.light .msg pre { background: #eee; border-color: #ccc; }
  body.light .msg code { background: rgba(0,0,0,.07); }
  body.light .msg pre code { background: none; }
  body.light .user { background: #2d5a8f; color: #fff; }
  body.light .assistant { background: #fff; border-color: #ddd; color: #222; }
  body.light .sys { color: #666; }
  body.light .msgtime { color: #666; }
  body.light .copybtn { border-color: #999; color: #555; }
  body.light .usage { color: #666; }
  body.light .tool { color: #555; border-color: #999; }
  body.light .tool.err { color: #c00; border-color: #c00; }
  body.light .tool .tooldetail { color: #444; background: #f0f0f0; border-color: #bbb; }
  body.light footer { background: #fff; border-color: #ddd; }
  body.light footer select { background: #fff; color: #222; border-color: #bbb; }
  body.light #input { background: #fff; color: #222; border-color: #bbb; }
  body.light #charCount { color: #666; }
  /* 文字サイズの切り替え: スマホの小さい画面や屋外では標準の
     文字が読みにくいことがあるため、小・標準・大の3段階を用意
     する。メッセージと入力欄だけが対象で、ヘッダー類は変わらない。 */
  body.font-small .msg { font-size: 12px; }
  body.font-small #input { font-size: 12px; }
  body.font-large .msg { font-size: 17px; }
  body.font-large #input { font-size: 17px; }
</style>
</head>
<body>
<header>
  <label>サーバ <input id="server" value="http://100.102.129.64:4096"></label>
  <label>履歴 <select id="serverHistory"><option value="">（履歴から選ぶ）</option></select></label>
  <label>モデル <select id="model"><option value="opencode/deepseek-v4.1-flash-free">opencode/deepseek-v4.1-flash-free</option></select></label>
  <button id="themeToggle">明るい表示</button>
  <button id="fontSizeToggle">文字: 標準</button>
  <button id="soundToggle">通知音: オン</button>
  <span id="status">未接続</span>
</header>
<header>
  <select id="sessionList"><option value="">（セッション一覧）</option></select>
  <label>検索 <input id="sessionSearch" type="search" placeholder="タイトルで絞り込み"></label>
  <button id="sortSessions">並び替え: 更新順</button>
  <button id="newSession">新規</button>
  <button id="rename">名前変更</button>
  <button id="pinSession">ピン留め</button>
  <button id="deleteSession">削除</button>
  <button id="exportMd">書き出し</button>
  <button id="exportJson">JSON書き出し</button>
  <button id="copyChat">会話をコピー</button>
  <button id="refreshList">一覧更新</button>
</header>
<div id="titleBar"><span id="curTitle">（セッション未選択）</span><span id="curId"></span><span id="curCount"></span><button id="copySessionId" class="copybtn" disabled>IDをコピー</button><input id="chatSearch" type="search" placeholder="会話内を検索"><span id="chatSearchCount"></span><button id="chatSearchPrev" class="copybtn" disabled>↑ 前へ</button><button id="chatSearchNext" class="copybtn" disabled>↓ 次へ</button><button id="toggleAllFold" class="copybtn" disabled>すべて展開</button></div>
<main id="chat"></main>
<button id="toLatest">最新へ ↓</button>
<footer>
  <textarea id="input" rows="2" placeholder="プロンプトを入力（Enter で送信、Shift+Enter で改行）"></textarea>
  <span id="charCount"></span>
  <button id="send">送信</button>
  <button id="resend" disabled>再送信</button>
  <button id="abort" disabled>中断</button>
  <select id="snippetList"><option value="">（定型文）</option></select>
  <button id="saveSnippet">定型文を保存</button>
  <button id="deleteSnippet">定型文を削除</button>
</footer>
<script>
"use strict";
// This page depends only on the opencode server's public REST API:
//   GET   /session                 -> list sessions (id, title, time)
//   (the same GET /session doubles as the periodic reachability
//   probe for the connection monitor; no extra endpoint is needed)
//   POST  /session                 -> create a session
//   PATCH /session/{id}            -> rename a session
//   DELETE /session/{id}           -> delete a session (with confirmation)
//   GET   /config/providers    -> providers with their models (+ defaults)
//   GET   /provider           -> all providers + connected ids (fallback)
//   POST  /session/{id}/message    -> send a prompt, wait for the reply
//   POST  /session/{id}/prompt_async -> send a prompt, reply arrives via events (204)
//   GET   /event                   -> server-sent events (streaming replies)
//   POST  /session/{id}/abort      -> stop a running reply
//   GET   /session/{id}/message    -> read a session's history
//   (a message's info carries time.created (ms since epoch); an
//   assistant message's info also carries tokens {input, output,
//   reasoning, cache {read, write}} and cost in USD; a message's
//   parts are text and tool calls, the latter with a state
//   {status: pending|running|completed|error, title?})
// Sessions and titles live on the server, so history is shared by
// every browser that opens this page. Nothing else about opencode
// (version, storage, internals) is assumed.
const $ = id => document.getElementById(id);
const chat = $("chat"), statusEl = $("status"), listEl = $("sessionList");
// 表示テーマの切り替え: 暗い表示（既定）と明るい表示をヘッダーの
// ボタンで切り替え、選択は localStorage に保存して次回も使う。
// 明るい表示の配色は body.light の CSS が決める。
const THEME_KEY = "oc-theme";
function applyTheme(light) {
  document.body.classList.toggle("light", light);
  $("themeToggle").textContent = light ? "暗い表示" : "明るい表示";
}
applyTheme(localStorage.getItem(THEME_KEY) === "light");
$("themeToggle").onclick = () => {
  const light = !document.body.classList.contains("light");
  try { localStorage.setItem(THEME_KEY, light ? "light" : "dark"); } catch (e) {}
  applyTheme(light);
};
// 文字サイズの切り替え: 小・標準・大をヘッダーのボタンで巡回し、
// 選択は localStorage に保存して次回も使う。配色の切り替えと
// 同じ形で、body の class だけを付け替える。
const FONT_KEY = "oc-font-size";
const FONT_SIZES = ["small", "standard", "large"];
const FONT_LABELS = { small: "文字: 小", standard: "文字: 標準", large: "文字: 大" };
function applyFontSize(size) {
  if (!FONT_SIZES.includes(size)) size = "standard";
  document.body.classList.toggle("font-small", size === "small");
  document.body.classList.toggle("font-large", size === "large");
  $("fontSizeToggle").textContent = FONT_LABELS[size];
  return size;
}
let fontSize = applyFontSize(localStorage.getItem(FONT_KEY) || "standard");
$("fontSizeToggle").onclick = () => {
  fontSize = FONT_SIZES[(FONT_SIZES.indexOf(fontSize) + 1) % FONT_SIZES.length];
  try { localStorage.setItem(FONT_KEY, fontSize); } catch (e) {}
  applyFontSize(fontSize);
};
// 応答完了を音で知らせる: 無料モデルは応答が遅いことがあるため、
// 他のタブを見ている間に返信が終わっても気づけるよう、タブが隠れて
// いるときだけ短い音を鳴らす。タブを見ているときは画面で分かるので
// 鳴らさない。音は WebAudio の発振器で作るので外部ファイルは要らない。
// AudioContext は送信時のクリック（ユーザーの操作）で作っておく:
// 応答完了の時点では操作から時間が経っていて作れない場合があるため。
// ヘッダーのボタンで切り替え、選択は localStorage に保存する。
const SOUND_KEY = "oc-sound";
let soundOn = localStorage.getItem(SOUND_KEY) !== "off";
let audioCtx = null;
function updateSoundBtn() {
  $("soundToggle").textContent = "通知音: " + (soundOn ? "オン" : "オフ");
}
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) { audioCtx = null; }
}
function playTone(freq, startAt, dur) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, startAt);
  gain.gain.exponentialRampToValueAtTime(0.2, startAt + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, startAt + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(startAt);
  osc.stop(startAt + dur + 0.05);
}
function playNotify(kind) {
  if (!soundOn || !audioCtx || !document.hidden) return;
  try {
    const t = audioCtx.currentTime;
    if (kind === "done") {
      playTone(880, t, 0.18);
      playTone(1318.5, t + 0.2, 0.25);
    } else {
      playTone(330, t, 0.25);
    }
  } catch (e) { /* 音が出なくても応答表示には影響しない */ }
}
updateSoundBtn();
$("soundToggle").onclick = () => {
  soundOn = !soundOn;
  try { localStorage.setItem(SOUND_KEY, soundOn ? "on" : "off"); } catch (e) {}
  updateSoundBtn();
  if (soundOn) { ensureAudio(); if (audioCtx) playTone(880, audioCtx.currentTime, 0.15); }
};
$("server").value = localStorage.getItem("oc-server") || $("server").value;
// 接続先の履歴: 場所ごとに置いたノード（自宅・コワーキングなど）は
// サーバのアドレスが違うため、使った接続先を localStorage に最大
// 10件まで保存し、履歴の一覧から選んで切り替えられるようにする。
// 履歴から選ぶとサーバ欄の変更と同じ扱いになり、イベント接続・
// モデル一覧・接続確認をやり直す。末尾の / は除いて保存するので、
// 同じ接続先が表記違いで重複しない。
const SERVERS_KEY = "oc-servers";
const SERVERS_MAX = 10;
let savedServers = [];
try { savedServers = JSON.parse(localStorage.getItem(SERVERS_KEY) || "[]"); } catch (e) { savedServers = []; }
if (!Array.isArray(savedServers)) savedServers = [];
function saveServers() {
  try { localStorage.setItem(SERVERS_KEY, JSON.stringify(savedServers)); } catch (e) {}
}
function renderServerHistory() {
  const el = $("serverHistory");
  el.innerHTML = "";
  const none = document.createElement("option");
  none.value = "";
  none.textContent = "（履歴から選ぶ）";
  el.appendChild(none);
  for (const u of savedServers) {
    const o = document.createElement("option");
    o.value = u;
    o.textContent = u;
    el.appendChild(o);
  }
}
function rememberServer(url) {
  url = (url || "").replace(/\/+$/, "");
  if (!url) return;
  savedServers = [url, ...savedServers.filter(u => u !== url)].slice(0, SERVERS_MAX);
  saveServers();
  renderServerHistory();
}
renderServerHistory();
rememberServer($("server").value);
// The saved model may not be among the initial options, so add it
// as an option first; refreshModels() rebuilds the list from the
// server and keeps the saved value selected when it is available.
const savedModel = localStorage.getItem("oc-model");
if (savedModel && ![...$("model").options].some(o => o.value === savedModel)) {
  const o = document.createElement("option");
  o.value = savedModel;
  o.textContent = savedModel;
  $("model").appendChild(o);
}
$("model").value = savedModel || $("model").value;
let currentId = "";
// All sessions fetched from the server, kept so the search box can
// filter the dropdown without another fetch.
let allSessions = [];
// The session whose reply is currently being awaited, if any, and
// whether the user asked to stop it. The abort button posts to the
// server; it does not merely cancel the local fetch, so generation
// itself stops on the server side.
let pendingId = "";
let aborted = false;

// 応答にかかった時間の表示: 送信から応答完了までの経過秒数を
// ステータス欄に1秒ごとに表示し、完了後は使用量の行に残す。
// 無料モデルは応答が遅いことがあるため、待っている間の目安になる。
// 応答完了をタブのタイトルで知らせる: 無料モデルは応答が遅い
// ことがあるため、他のタブを見ている間に返信が終わっても気づける
// よう、送信中はタイトルを「応答中…」にし、完了時はタブが隠れて
// いれば「応答完了」にする。タブに戻ると元のタイトルに戻る。
const BASE_TITLE = document.title;
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) document.title = BASE_TITLE;
});
function setReplyTitle(text) {
  document.title = text ? text + " - " + BASE_TITLE : BASE_TITLE;
}
let replyStart = 0;
let replyTimer = null;
function startReplyTimer() {
  stopReplyTimer();
  replyStart = Date.now();
  setStatus("応答中… 0秒");
  replyTimer = setInterval(() => {
    const s = Math.floor((Date.now() - replyStart) / 1000);
    setStatus("応答中… " + s + "秒");
  }, 1000);
}
function stopReplyTimer() {
  if (replyTimer) { clearInterval(replyTimer); replyTimer = null; }
}
function replySeconds() {
  return replyStart ? Math.round((Date.now() - replyStart) / 1000) : null;
}

// Streaming state for the reply currently being awaited. The server
// pushes the assistant's text as message.part.updated events (each
// carrying the part's full current text) and marks the end with
// session.status {type:"idle"} (or session.idle). streamWait is the
// "応答待ち…" bubble, replaced by the assistant bubble on first text.
let events = null;
let eventsConnected = false;
let streamParts = {};
let streamMsgId = "";
let streamBubble = null;
let streamWait = null;
let waitIdle = null;
// Tool (and other non-text) part rows of the reply currently being
// awaited, keyed by part id, so a part.updated event refreshes the
// same row instead of adding another one.
let streamPartLines = {};

function connectEvents() {
  if (events) { events.close(); events = null; }
  eventsConnected = false;
  let url;
  try { url = base() + "/event"; } catch (e) { return; }
  try { events = new EventSource(url); } catch (e) { events = null; return; }
  events.onopen = () => { eventsConnected = true; };
  events.onerror = () => { eventsConnected = false; };
  events.onmessage = e => {
    let ev;
    try { ev = JSON.parse(e.data); } catch (_) { return; }
    onEvent(ev);
  };
}

function onEvent(ev) {
  const p = ev.properties || {};
  if (!pendingId || p.sessionID !== pendingId || currentId !== pendingId) return;
  if (ev.type === "message.updated" && p.info && p.info.role === "assistant") {
    streamMsgId = p.info.id;
  } else if (ev.type === "message.part.updated" && p.part && p.part.type === "text") {
    if (!streamMsgId || p.part.messageID !== streamMsgId) return;
    if (streamWait) { streamWait.remove(); streamWait = null; }
    if (!streamBubble) streamBubble = addMsg("assistant", "");
    streamBubble._streaming = true;
    streamParts[p.part.id] = p.part.text;
    setMsgText(streamBubble, Object.values(streamParts).join(""));
    scrollChat();
  } else if (ev.type === "message.part.updated" && p.part && p.part.type !== "text") {
    if (!streamMsgId || p.part.messageID !== streamMsgId) return;
    if (streamWait) { streamWait.remove(); streamWait = null; }
    const el = streamPartLines[p.part.id];
    if (el) updatePartLine(el, p.part);
    else streamPartLines[p.part.id] = addPartLine(p.part);
    scrollChat();
  } else if (ev.type === "session.idle" ||
      (ev.type === "session.status" && p.status && p.status.type === "idle")) {
    if (waitIdle) { const resolve = waitIdle; waitIdle = null; resolve(); }
  }
}

async function abortReply() {
  if (!pendingId) return;
  $("abort").disabled = true;
  aborted = true;
  try {
    await api("/session/" + encodeURIComponent(pendingId) + "/abort", { method: "POST" });
  } catch (e) {
    // The in-flight message request will still settle below and
    // report the outcome; a failed abort needs no extra message.
  }
}

function base() { return $("server").value.replace(/\/+$/, ""); }

// Sum the token counts and cost of every assistant message in the

  const old = chat.querySelector(".usage.total");
  if (old) old.remove();

  let any = false;

      if (typeof t.input === "number") { input += t.input; any = true; }
      if (typeof t.output === "number") { output += t.output; any = true; }

// Rebuild the model dropdown from the server's providers, grouped

// so the list stays usable; /provider filtered by its `connected`
// ids is the fallback. The saved model is kept as an option when
// the server no longer lists it, and sending still works when the
// fetch fails, because the current option is left in place.
async function refreshModels() {
  const modelEl = $("model");
  const saved = localStorage.getItem("oc-model") || modelEl.value;
  let providers = null;
  try {
    const data = await api("/config/providers");
    providers = data.providers;
  } catch (e) { /* fall through to /provider */ }
  if (!providers || !providers.length) {
    try {
      const data = await api("/provider");
      const connected = new Set(data.connected || []);
      providers = (data.all || []).filter(p => connected.has(p.id));
    } catch (e) { providers = null; }
  }
  if (!providers || !providers.length) {
    if (saved && ![...modelEl.options].some(o => o.value === saved)) {
      const o = document.createElement("option");
      o.value = saved;
      o.textContent = saved;
      modelEl.appendChild(o);
    }
    if (saved) modelEl.value = saved;
    return;
  }
  modelEl.innerHTML = "";
  let found = false;
  for (const p of providers) {
    const models = Object.values(p.models || {})
      .sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));
    if (!models.length) continue;
    const group = document.createElement("optgroup");
    group.label = p.name || p.id;
    for (const m of models) {
      const o = document.createElement("option");
      o.value = p.id + "/" + m.id;
      o.textContent = m.name || m.id;
      if (o.value === saved) found = true;
      group.appendChild(o);
    }
    modelEl.appendChild(group);
  }
  if (!found && saved) {
    const o = document.createElement("option");
    o.value = saved;
    o.textContent = saved + "（取得外）";
    modelEl.insertBefore(o, modelEl.firstChild);
  }
  modelEl.value = saved;
  if (!modelEl.value && modelEl.options.length) modelEl.selectedIndex = 0;
  localStorage.setItem("oc-model", modelEl.value);
}

// セッションのピン留め: よく使う会話を一覧の先頭に固定する。

// Rebuild the session dropdown from allSessions, keeping only the

function renderListOptions(selectedId) {

  const none = document.createElement("option");

  none.textContent = "（セッション一覧）";
  listEl.appendChild(none);
  const sorted = [...allSessions].sort((a, b) =>
    (isPinned(b.id) ? 1 : 0) - (isPinned(a.id) ? 1 : 0) ||

async function ensureSession() {

function promptBody(text) {

    model: { providerID, modelID: rest.join("/") },

  };

// Synchronous reply (the original behaviour): POST /message and wait
// for the full reply. Used when the event stream is unavailable.
async function syncReply(id, text, wait) {
  const reply = await api("/session/" + encodeURIComponent(id) + "/message", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(promptBody(text)),
  });
  wait.remove();
  const shown = renderMessage(reply);
  addUsage(reply.info, replySeconds());
  if (aborted) addMsg("sys", "中断しました");
  else if (!shown) addMsg("assistant", "(テキスト応答なし)");
}

// Streaming reply: POST prompt_async, then fill the assistant bubble
// from message.part.updated events until the session goes idle.
// Falls back to syncReply when the server has no prompt_async.
async function streamReply(id, text, wait) {
  streamParts = {};
  streamMsgId = "";
  streamBubble = null;
  streamWait = wait;
  streamPartLines = {};
  try {
    await api("/session/" + encodeURIComponent(id) + "/prompt_async", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(promptBody(text)),
    });
  } catch (e) {
    if (/HTTP 40[45]/.test(e.message)) { streamWait = null; await syncReply(id, text, wait); return; }
    throw e;
  }
  // Wait for the idle event; the watchdog ends the wait if the event
  // is missed (the server keeps generating; reopening the session
  // shows the full reply).
  await new Promise(resolve => {
    waitIdle = resolve;
    setTimeout(() => { if (waitIdle) { waitIdle = null; resolve(); } }, 240000);
  });
  // Final sync: the stored message is the source of truth for what
  // the bubble should hold, covering any missed part events.
  try {
    const messages = await api("/session/" + encodeURIComponent(id) + "/message");
    const last = [...messages].reverse().find(m =>
      m.info && m.info.role === "assistant" && (!streamMsgId || m.info.id === streamMsgId));
    const out = last ? (last.parts || []).filter(p => p.type === "text").map(p => p.text).join("") : "";
    if (out) {
      if (!streamBubble) streamBubble = addMsg("assistant", "");
      setMsgText(streamBubble, out);
      setMsgTime(streamBubble, msgTime(last));
    }
    syncPartLines(last);
    addUsage(last && last.info, replySeconds());
  } catch (e) { /* keep whatever streamed in; the list refresh follows */ }
  if (streamWait) { streamWait.remove(); streamWait = null; }
  if (aborted) addMsg("sys", "中断しました");
  else if ((!streamBubble || !streamBubble._body.textContent) && !Object.keys(streamPartLines).length)
    addMsg("assistant", "(テキスト応答なし)");
}

// 直前のプロンプトをもう一度送る: 応答が途中で切れたりエラーに
// なったりしたとき、同じ文を入力し直さずに再送できる。再送時は
// 入力欄の下書きには触れない。send() に引数を渡すとその文を送り、
// 渡さなければ入力欄の文を送る。
let lastSentText = "";
async function send(resendText) {
  const text = (resendText ?? $("input").value).trim();
  if (!text) return;
  saveHistory(text);
  lastSentText = text;
  if (resendText === undefined) {
    $("input").value = "";
    localStorage.removeItem("oc-draft");
    autoResize();
    updateCharCount();
  }
  $("send").disabled = true;
  $("resend").disabled = true;
  $("abort").disabled = false;
  $("deleteSession").disabled = true;
  aborted = false;
  ensureAudio();
  addMsg("user", text, Date.now());
  scrollChat(true);
  const wait = addMsg("sys", "応答待ち…");
  try {
    startReplyTimer();
    setReplyTitle("応答中…");
    const id = await ensureSession();
    pendingId = id;
    if (eventsConnected) await streamReply(id, text, wait);
    else await syncReply(id, text, wait);
    // The server assigns/updates the title after an exchange; pull
    // the fresh list so the title bar and dropdown stay current.
    await refreshList(id);
    // Refresh the session-wide totals with the reply included.
    // (One extra GET; the totals line is a nicety, so a failure
    // here must not report an error for the reply itself.)
    try {
      const messages = await api("/session/" + encodeURIComponent(id) + "/message");
      showSessionTotals(messages);
      setMsgCount(messages.length);
    } catch (e) { /* keep the reply as shown */ }
    setStatus("接続済み");
    setReplyTitle(document.hidden ? "応答完了" : "");
    playNotify("done");
  } catch (e) {
    wait.remove();
    if (aborted) {
      addMsg("sys", "中断しました");
      setStatus("接続済み");
      setReplyTitle(document.hidden ? "中断しました" : "");
      playNotify("error");
    } else {
      addMsg("sys", "エラー: " + e.message);
      setStatus("エラー", true);
      setReplyTitle(document.hidden ? "エラー" : "");
      playNotify("error");
    }
  } finally {
    stopReplyTimer();
    pendingId = "";
    // 逐次表示が終わったので、長い応答はここで折りたたみ対象になる。
    if (streamBubble) { streamBubble._streaming = false; updateFold(streamBubble); }
    streamBubble = null;
    streamWait = null;
    streamParts = {};
    streamMsgId = "";
    streamPartLines = {};
    waitIdle = null;
    $("send").disabled = false;
    $("resend").disabled = !lastSentText;
    $("abort").disabled = true;
    $("deleteSession").disabled = false;
    applyChatSearch();
    updateFoldAllBtn();
  }
}

let historyDraft = "";
function saveHistory(text) {
  if (!text) return;
  if (history[history.length - 1] === text) return;
  history.push(text);
  if (history.length > HISTORY_MAX) history = history.slice(-HISTORY_MAX);
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
  historyIndex = -1;

function showHistory(i) {

$("input").addEventListener("keydown", e => {

  if (!history.length) return;
  const inputEl = $("input");
  if (historyIndex === -1) {
    // たどり始め: 入力欄が空か、カーソルが先頭のときだけ。
    if (e.key === "ArrowDown") return;
    if (inputEl.value && inputEl.selectionStart !== 0) return;
    e.preventDefault();
    historyDraft = inputEl.value;
    showHistory(0);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    if (historyIndex < history.length - 1) showHistory(historyIndex + 1);
  } else {
    e.preventDefault();
    if (historyIndex > 0) showHistory(historyIndex - 1);
    else { historyIndex = -1; inputEl.value = historyDraft; autoResize(); updateCharCount(); }
  }
});
$("input").addEventListener("input", () => { historyIndex = -1; });
// 定型文: よく使うプロンプトを名前付きで保存し、フッターの

// 切り替えても残るので、同じ語で別の会話も探せる。
// 「次へ／前へ」ボタンで一致したメッセージへ順に移動できる。
// 長い会話では一致箇所まで手で探す必要がなくなる。現在位置の

    el.classList.remove("dimmed", "match", "current");

  const el = chatMatches[chatMatchIndex];

      for (const p of m.parts || []) {
        if (p.type === "text") lines.push(p.text);
        else if (p.type === "tool") lines.push("（ツール呼び出し: " + (p.tool || "tool") + "）");
        else lines.push("（" + p.type + "）");
      }
      const parts = usageParts(m.info);
      if (parts.length) lines.push("", "使用量: " + parts.join(" · "));
      lines.push("");
    }
    const blob = new Blob([lines.join("\n")], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = stamp + "-" + (mdSafe(title) || "session") + ".md";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    addMsg("sys", "会話を Markdown として書き出しました");
  } catch (e) { setStatus("エラー: " + e.message, true); }
}
$("exportMd").onclick = exportConversation;
// 会話を JSON として書き出す: Markdown の書き出しとは別に、
// サーバから取得したメッセージをそのまま JSON ファイルにする。
// トークン数やツール呼び出しの状態など、画面に表示しきれない
// 情報も残るので、後から調べたり別のツールで読んだりできる。
async function exportConversationJson() {
  if (!currentId) { setStatus("セッションが未選択です", true); return; }
  try {
    const messages = await api("/session/" + encodeURIComponent(currentId) + "/message");
    const now = new Date();
    const stamp = now.getFullYear() + String(now.getMonth() + 1).padStart(2, "0") +
      String(now.getDate()).padStart(2, "0") + "-" +
      String(now.getHours()).padStart(2, "0") + String(now.getMinutes()).padStart(2, "0");
    const data = {
      title: $("curTitle").textContent,
      sessionId: currentId,
      exportedAt: now.toISOString(),
      messages,
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = stamp + "-" + (mdSafe($("curTitle").textContent) || "session") + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    addMsg("sys", "会話を JSON として書き出しました");
  } catch (e) { setStatus("エラー: " + e.message, true); }
}
$("exportJson").onclick = exportConversationJson;
// 会話全体をコピーする: 書き出し（ファイル保存）とは別に、
// 現在の会話をそのままの文面でクリップボードに入れる。他の
// ツールへ貼り付けるときに使う。文面は書き出しと同じ材料
// （テキスト、ツール呼び出しの行、使用量）で作る。
async function copyConversation() {
  if (!currentId) { setStatus("セッションが未選択です", true); return; }
  try {
    const messages = await api("/session/" + encodeURIComponent(currentId) + "/message");
    const lines = [$("curTitle").textContent, ""];
    for (const m of messages) {
      const role = m.info && m.info.role === "user" ? "ユーザー" : "アシスタント";
      const t = msgTime(m);
      lines.push(role + (t ? "（" + fmtTime(t) + "）" : "") + ":");
      for (const p of m.parts || []) {
        if (p.type === "text") lines.push(p.text);
        else lines.push(partLineText(p));
      }
      const parts = usageParts(m.info);
      if (parts.length) lines.push("使用量: " + parts.join(" · "));
      lines.push("");
    }
    const ok = await copyText(lines.join("\n"));
    if (ok) addMsg("sys", "会話をコピーしました");
    else setStatus("コピーに失敗しました", true);
  } catch (e) { setStatus("エラー: " + e.message, true); }
}
$("copyChat").onclick = copyConversation;
$("server").onchange = () => {
  localStorage.setItem("oc-server", $("server").value);
  rememberServer($("server").value);
  connectEvents();
  refreshModels();
  checkConnection();
};
// 履歴から接続先を選ぶ: サーバ欄に入れて変更時と同じ処理を走らせ、
// 一覧は選び直せるよう placeholder に戻す。
$("serverHistory").onchange = () => {
  const url = $("serverHistory").value;
  if (!url) return;
  $("server").value = url;
  $("server").onchange();
  $("serverHistory").value = "";
};
$("model").onchange = () => localStorage.setItem("oc-model", $("model").value);

// On open: start the connection monitor, connect the event
// stream, fetch the model list and the session list and, if the
// last-used session is still there, reopen it with its history.
(async () => {
  startMonitor();
  connectEvents();
  try { await refreshModels(); } catch (e) { /* keep the saved model option */ }
  try {
    await refreshList();
    const last = localStorage.getItem("oc-last-session");
    if (last && [...listEl.options].some(o => o.value === last)) {
      await selectSession(last, true);
    }
  } catch (e) { setStatus("エラー: " + e.message, true); }
})();
</script>
</body>
